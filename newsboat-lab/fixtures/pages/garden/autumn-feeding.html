<h1>Feeding the soil in autumn</h1>
<p><em>The Example Garden Notes — a fixture page invented for this guide's lab.</em></p>
<p>When the beds empty in autumn, cover them. A blanket of compost or leaf mould protects the surface from winter rain, feeds the worms, and saves you a digging job in spring.</p>
