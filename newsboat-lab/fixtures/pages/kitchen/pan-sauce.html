<h1>The five-minute pan sauce</h1>
<p><em>The Sample Kitchen Journal — a fixture page invented for this guide's lab.</em></p>
<p>After frying, the pan holds the flavour. Pour in a glass of water or wine, scrape the browned bits loose as it bubbles, and finish with a knob of butter. Five minutes turns plain into finished.</p>
