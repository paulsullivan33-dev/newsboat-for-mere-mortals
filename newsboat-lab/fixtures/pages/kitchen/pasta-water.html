<h1>Salting pasta water, honestly</h1>
<p><em>The Sample Kitchen Journal — a fixture page invented for this guide's lab.</em></p>
<p>About a tablespoon of salt per litre of water, added when the water boils. The pasta is seasoned from the inside, and a cup of the starchy water loosens any sauce. That is the entire trick.</p>
