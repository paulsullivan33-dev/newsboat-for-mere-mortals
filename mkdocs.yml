site_name: Newsboat for Mere Mortals
site_description: A feed reader that lives in your terminal. Subscribing to RSS and Atom feeds with a plain text file, reading in a keyboard-driven interface, searching and building query feeds, queueing podcasts for its companion Podboat, and keeping the cache tidy, with the limits stated plainly.
